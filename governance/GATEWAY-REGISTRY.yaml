version: "1.1"
project: "cresco-worlds-fair"
date: "2026-10-01"
status_values:
  - PROVEN
  - ACTIVE
  - BLOCKED
  - PENDING
  - N/A
  - UNKNOWN

rules:
  - "Every registered gate must always have an explicit status."
  - "N/A means currently not applicable, never forgotten."
  - "Re-evaluate the registry whenever scope, architecture, runtime, sponsor dependency, evidence state, or submission state changes."
  - "A dependent but unproven gateway is BLOCKED, never implied PASS."
  - "A gate may be PROVEN only when cited evidence actually exists and matches the demonstrated commit/runtime."
  - "Do not weaken or bypass validators to obtain promotion."

registry:
  - id: CORE_LIFECYCLE
    name: "QUALIFY → DECIDE → DESIGN → DELIVER → AUDIT → EXPAND"
    status: ACTIVE
    activates_when: "All builds"
    condition: "Macro lifecycle remains explicit across the full project."

  - id: JUDGED_BUILD_CYCLE
    name: "RUBRIC → PAIN → PROBLEM → NEGATIVE EVENT → DIFFERENTIATOR → EXECUTION → LIVE DEPTH → EVIDENCE → STORY → DEMO → Q&A"
    status: ACTIVE
    activates_when: "Hackathons / judged builds"
    condition: "No stage silently skipped."

  - id: PRE_BUILD_REALITY
    name: "Pre-Build Reality Gate"
    status: ACTIVE
    activates_when: "All concepts before Concept Lock"
    condition: "Real problem, real user, negative event, observable impact, durability, willingness-to-pay signal, killer demo, native advantage."

  - id: COMPETITIVE_NOVELTY_KILL
    name: "Competitive Novelty / Kill Gate"
    status: ACTIVE
    activates_when: "Before Concept Lock"
    condition: "Actively search nearby products, repos, papers, standards, submissions and prior winners."
    evidence:
      - "docs/SEMANTIC-TEARDOWN.md"
      - "research/CONCEPT-COLLISION-V3.md"
      - "research/SANCTION-DELTA.md"
      - "research/INTERVIEW-SANCTION-2026-09-29.md"
      - "research/PRIMER-VAULT-DELTA.md"

  - id: CONCEPT_COMPRESSION
    name: "Concept Compression & Validation"
    status: ACTIVE
    activates_when: "Before Concept Lock"
    condition: "Compress problem, user, mechanism, differentiator, native advantage, killer demo and kill criteria into a coherent concept."

  - id: TECHNICAL_REALITY
    name: "Technical Reality Check"
    status: N/A
    activates_when: "After Concept Lock"
    condition: "Architecture genuinely feasible; claims match implementation reality."

  - id: BACKEND_ENGINEERING_INTELLIGENCE
    name: "Backend Engineering Intelligence"
    status: N/A
    activates_when: "After Concept Lock and Technical Reality Check"
    condition: "SCALE ON EVIDENCE, NOT POSSIBILITY."

  - id: TRUTH_BOUNDARY
    name: "Truth Boundary Gate"
    status: ACTIVE
    activates_when: "All builds"
    condition: "Use OBSERVED / INFERRED / UNKNOWN; no false PASS; missing evidence → UNKNOWN."
    evidence:
      - "product/PRD.md"
      - "docs/BASELINE-DELTA.md"

  - id: NEGATIVE_PATH
    name: "Negative Path Gate"
    status: ACTIVE
    activates_when: "All builds"
    condition: "REFUSE / ABSTAIN / REVIEW / UNKNOWN when evidence or authority is insufficient."

  - id: NEGATIVE_EVENT
    name: "Negative Event Gate"
    status: PROVEN
    activates_when: "All builds; mandatory for judged builds"
    condition: "Concrete verified failure + observable impact + design implication + product response."
    evidence:
      - "research/NEGATIVE-EVENT-MAP.md"

  - id: EVIDENCE_INTEGRITY
    name: "Evidence Integrity Gate"
    status: ACTIVE
    activates_when: "All builds"
    condition: "Correct labels: LIVE / LOCAL / LOCAL_STUB / PRESEEDED / SIMULATED / PARTIAL / NOT_IMPLEMENTED."

  - id: PRODUCT_DEPTH_LIVE_REALITY
    name: "Product Reality / Integration-First Product Exploitation v1.3"
    status: ACTIVE
    activates_when: "All material product/build/hackathon workflows from this material touch forward"
    condition: "Vertical Slice is entry point, not Definition of Done; real action and live integration outrank proof-only artifacts."
    evidence:
      - "governance/PRODUCT-DEPTH-LIVE-REALITY-v1.2.1.md"
      - "governance/REALITY-LEDGER.md"
      - "governance/LIFECYCLE-COVERAGE.yaml"
      - "state/CURRENT.yaml"
    canonical_policy: "Faadil1/faadil-agent-system/PRODUCT-REALITY-POLICY.yaml@1.3.0"
    adoption_date: "2026-10-01"
    no_backdating: true

  - id: RUNTIME_COMMIT_BINDING
    name: "Runtime / Commit Binding Gate"
    status: ACTIVE
    activates_when: "As soon as any runtime exists"
    condition: "Runtime proof must bind to the actual demonstrated commit."
    evidence:
      - "docs/BASELINE-DELTA.md"

  - id: PUBLIC_RUNTIME
    name: "Public Runtime Gate"
    status: N/A
    activates_when: "World’s Fair runtime exists"
    condition: "Public runtime must be reachable and consistent with the claimed build."

  - id: PRE_LAUNCH_SHIP
    name: "Universal Pre-Launch / Ship Assurance"
    status: N/A
    activates_when: "Before shipping a live build"
    condition: "PRE_LAUNCH_CODE_OK → DEPLOY → LIVE_RUNTIME_CHECK → CRITICAL_PATH_PASS → PROOF_CAPTURED → SHIP."

  - id: DETERMINISTIC_DEMO
    name: "Deterministic Demo Gate"
    status: N/A
    activates_when: "Before recording"
    condition: "Canonical run, negative path, recovery/fallback, no fragile hidden dependency."

  - id: DISTINCTIVENESS_ESCALATION
    name: "Distinctiveness Escalation — FUNCTIONAL ≠ FINISHED"
    status: N/A
    activates_when: "Mandatory before Demo Lock / Submission Lock"
    condition: "Agency, closed loop, second act, consequential memory, counter-case, signature moment, hard-to-copy advantage, simple demo-proven sentence; avoid feature bloat."

  - id: OUTSIDER_BREAK
    name: "Outsider Break Test"
    status: N/A
    activates_when: "After live build, before Demo Lock"
    condition: "External person can run/break critical path without builder coaching."

  - id: JUDGE_PERFORMANCE_ASSURANCE
    name: "Judge Performance Assurance"
    status: N/A
    activates_when: "Before submission"
    condition: "Signature behavior, signature moment, Judge Memory Sentence, hostile Q&A."

  - id: SUBMISSION_INTEGRITY
    name: "Submission Integrity Gate"
    status: ACTIVE
    activates_when: "Any competition"
    condition: "Repo, proofs, runtime, video, README, claims, licenses and rules stay mutually consistent."

  - id: RULES_ELIGIBILITY
    name: "Rules / Eligibility Gate"
    status: ACTIVE
    activates_when: "Competitions / grants / sponsor programs"
    condition: "Official rules, eligibility, deadline, required artifacts and prohibited claims verified."

  - id: SPONSOR_NATIVE_ADVANTAGE
    name: "Sponsor / Ecosystem Native Advantage Gate"
    status: ACTIVE
    activates_when: "Hackathon or sponsor ecosystem"
    condition: "Sponsor/ecosystem usage must be load-bearing where claimed, not decorative."

  - id: DATA_PROVENANCE_FRESHNESS
    name: "Data Provenance / Freshness Gate"
    status: ACTIVE
    activates_when: "External data, oracles, market evidence, datasets"
    condition: "Provenance, freshness, timestamp and failure semantics explicit."

  - id: EXTERNAL_DEPENDENCY_FAILURE
    name: "External Dependency / Failure Gate"
    status: ACTIVE
    activates_when: "Any load-bearing external service or protocol"
    condition: "Dependency failure mode, fallback/refusal behavior and clean-room assumptions tested."

  - id: HUMAN_ACTION_BOUNDARY
    name: "Human Action Boundary Gate"
    status: ACTIVE
    activates_when: "Protected approvals, signings, submissions or irreversible actions"
    condition: "Human-protected actions remain explicit checkpoints; automation must not silently cross them."

  - id: SECURITY_SECRETS
    name: "Security / Secrets Gate"
    status: ACTIVE
    activates_when: "All builds with credentials, wallets, APIs or deployment secrets"
    condition: "No secrets in repo/client bundle/logs; least necessary permissions."

  - id: IP_LICENSE_ORIGINALITY
    name: "IP / License / Originality Gate"
    status: ACTIVE
    activates_when: "All judged/public builds"
    condition: "Assets, fonts, code, datasets and references have compatible licenses/provenance; originality claims remain honest."

  - id: OBSERVABILITY_REPRODUCIBILITY
    name: "Observability / Reproducibility Gate"
    status: ACTIVE
    activates_when: "All builds after executable proof exists"
    condition: "Receipts, logs, setup, reproducibility and self-serve verification exist for material claims."

  - id: DEMO_ENVIRONMENT
    name: "Demo Environment Gate"
    status: N/A
    activates_when: "Once World’s Fair demo runtime exists"
    condition: "Known network/accounts/state; stable deterministic demo environment; explicit fallback."

  - id: ACCESSIBILITY_RESPONSIVE
    name: "Accessibility / Responsive Gate"
    status: N/A
    activates_when: "Once new user-facing World’s Fair UI exists"
    condition: "Responsive critical paths, keyboard/contrast/readability where applicable."

  - id: PERFORMANCE_LATENCY
    name: "Performance / Latency Gate"
    status: ACTIVE
    activates_when: "When latency materially affects the product"
    condition: "Latency budgets and execution timing tested where authority/trading decisions are time-sensitive."

  - id: GATEWAY_NANOPAYMENTS
    name: "Gateway / Nanopayments"
    status: N/A
    activates_when: "Transactional monetization / micropayment rail"
    condition: "Real rail or explicitly simulated."

  - id: X402
    name: "x402"
    status: N/A
    activates_when: "Machine-to-machine payment / paid unlock"
    condition: "No success claim without requirements/payment → verify → settle → HTTP 200/unlock plus relevant references and receipts."

  - id: WALLETS
    name: "Wallets"
    status: ACTIVE
    activates_when: "Blockchain identity or value involved"
    condition: "Network, address, signer, environment and evidence stay coherent."

  - id: CONTRACTS
    name: "Contracts"
    status: ACTIVE
    activates_when: "Smart contracts / onchain programs"
    condition: "Deployment, network, address, calls and receipts verifiable."

  - id: APP_KIT_EXTERNAL_PLATFORM
    name: "App Kit / External Platform Integration"
    status: N/A
    activates_when: "Sponsor/ecosystem explicitly requires it"
    condition: "Real demonstrable integration, not mention-only."

  - id: LIVE_GATEWAY_PROMOTION
    name: "LIVE_GATEWAY Promotion Gate"
    status: N/A
    activates_when: "Core value depends on a live external gateway"
    condition: "LOCAL_STUB cannot be promoted as live; live gateway proof is prerequisite to live-settlement claims."

  - id: FINAL_SNAPSHOT_HANDOVER_POSTMORTEM
    name: "Final Snapshot / CURRENT / HANDOVER / Post-mortem"
    status: N/A
    activates_when: "End of cycle / milestone / submission"
    condition: "Real project state, limitations, evidence and next steps preserved."

  - id: POST_SUBMISSION_INTEGRITY
    name: "Post-Submission Integrity Gate"
    status: N/A
    activates_when: "After submission"
    condition: "No silent runtime/routing/claim drift; corrections recorded canonically."

  - id: FROZEN_SUBMITTED_PROJECT_RULE
    name: "Frozen / Submitted Project Protection"
    status: ACTIVE
    activates_when: "Any project or milestone already frozen/submitted"
    condition: "No silent retrofit; explicit reopening required."

  - id: SYSTEM_CONTROL_PLANE_RECONCILIATION
    name: "System Control Plane v1 reconciliation"
    status: PROVEN
    activates_when: "Active project next material touch"
    condition: "Central CURRENT/HANDOVER and project canonical state reconciled without backdating."
    evidence:
      - "state/CURRENT.yaml"
      - "state/HANDOVER.yaml"

  - id: PROJECT_LIFECYCLE_COVERAGE
    name: "Project Lifecycle Completeness Coverage"
    status: PROVEN
    activates_when: "All material projects"
    condition: "Mandatory and triggered capabilities are explicitly resolved; missing capabilities cannot be hidden."
    evidence:
      - "governance/LIFECYCLE-COVERAGE.yaml"

  - id: CLAIM_RUNTIME_EVIDENCE_GRAPH
    name: "Claim → Runtime → Evidence Graph"
    status: ACTIVE
    activates_when: "Material live, sponsor-native, transactional, reliability/recovery or judge-facing claim"
    condition: "Required causal edges remain explicit; missing edges keep claims PARTIAL/MISSING/UNKNOWN."
    evidence:
      - "governance/EVIDENCE-GRAPH.yaml"
    current_state: "Baseline graph PARTIAL; World’s Fair live claims MISSING."

  - id: REFERENCE_INTELLIGENCE_PIPELINE
    name: "Reference Intelligence Pipeline"
    status: ACTIVE
    activates_when: "Material external reference matches current decision domain"
    condition: "Reference presence is advisory only; adoption requires verification and existing-owner decision."
    evidence:
      - "state/CURRENT.yaml"
    current_reference:
      id: "adevar_pre_audit_credits_cwf_2026"
      state: "CLASSIFIED / REFERENCE_ONLY"

  - id: RULE_LIFECYCLE
    name: "Rule Lifecycle / anti-over-systemization"
    status: ACTIVE
    activates_when: "A project lesson is proposed as a durable rule"
    condition: "Allowed decisions include NO_CHANGE / KEEP / MERGE_RULES / RELAX / RETIRE."
    current_decision: NO_CHANGE

  - id: CROSS_PROJECT_LEARNING
    name: "Cross-Project Learning"
    status: N/A
    activates_when: "Post-mortem or comparable multi-project evidence exists"
    condition: "No single project/interview result becomes a universal rule."
    not_applicable_reason: "CRESCO remains active and no multi-project generalization is being proposed."

  - id: ENGINEERING_QUALITY_ASSURANCE
    name: "Engineering Quality Assurance"
    status: N/A
    activates_when: "Active code-bearing World’s Fair build or other canonical trigger"
    condition: "Triggered code projects require bounded quality assurance plus regression evidence and receipt."
    not_applicable_reason: "No authorized code-bearing World’s Fair build exists yet; historical Stocklana baseline is not silently retrofitted."

  - id: PRODUCT_EXPLOITATION_LOOP
    name: "Post-Vertical-Slice Product Exploitation Loop"
    status: PENDING
    activates_when: "First live World’s Fair vertical slice exists after authorized Concept Lock"
    condition: "Continue coherent depth while marginal product value/differentiation justifies cost, risk and deadline."
    pending_reason: "No selected World’s Fair wedge has a live vertical slice yet."

  - id: PROJECT_STATE_CONTINUITY
    name: "CURRENT / HANDOVER continuity"
    status: PROVEN
    activates_when: "All active material projects"
    condition: "Canonical project state and exact next handoff are written to GitHub."
    evidence:
      - "state/CURRENT.yaml"
      - "state/HANDOVER.yaml"

