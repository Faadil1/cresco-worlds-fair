promotion_rules:
  x402:
    required_chain:
      - "requirements/payment"
      - "verify"
      - "settle"
      - "HTTP 200/unlock"
    rule: "LOCAL_STUB is design/demo evidence only and never LIVE_GATEWAY."
  live_gateway:
    rule: "If core product value depends on a real external gateway, that gateway must be proven before promotion as live."
    allowed_unproven_labels:
      - LOCAL_VERIFIED
      - SIMULATED
      - PARTIAL
  product_depth:
    rule: "Technical Proof ≠ Live Product Integration. Replay/static/captured evidence alone cannot satisfy a Live Core Loop claim."
  traction:
    rule: "One external trial ≠ adoption. Organic usage excludes scripted activity used to inflate traction."
  depth:
    rule: "Depth ≠ feature count. Polish cannot compensate for weak product reality."

authority_boundaries:
  HOI: "pre-lock intelligence advisory"
  PBPD: "production through BUILD_CANDIDATE_READY"
  Project_Finisher: "terminal assurance"
